# Render blueprint: one web service runs the site, the API and the lawn
# measurement service (scripts/start-production.mjs). Starter plan ($7/month,
# 512 MB, always on): very large scans can need ~730 MB, so move to Standard
# (2 GB) if they start failing. Secrets marked sync: false are entered in the Render
# dashboard, never committed.
services:
  - type: web
    name: ecoestate
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:production
    healthCheckPath: /api/app/public-settings
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://ecoestate.org
      - key: JWT_SECRET
        generateValue: true # signs private photo links
      - key: SUPABASE_URL
        value: https://lzstqfqslvaxyaxqelkv.supabase.co
      - key: GOOGLE_MAPS_API_KEY
        sync: false # server key, Street View Static only
      - key: VITE_GOOGLE_MAPS_BROWSER_KEY
        sync: false # browser key, Map Tiles only, limited to ecoestate.org (read at build time)
      - key: RESEND_API_KEY
        sync: false # send-only key; without it no email goes out
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false # optional: Billing Read, for real Cloudflare charges on /admin
      - key: RENDER_API_KEY
        sync: false # optional: for Render's CPU and memory graphs on /admin
      - key: RENDER_SERVICE_ID
        sync: false # optional: the srv-… id of this service
      - key: ADMIN_EMAILS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: GEOCODIO_API_KEY
        sync: false # lawn service: address lookups (from lawn-api/.env)
      - key: DEFAULT_WATER_PRICE
        sync: false # lawn service (from lawn-api/.env)
      - key: DEFAULT_REBATE_PER_SQFT
        sync: false # lawn service (from lawn-api/.env)
